# Where the model is. Copy to secret.yaml, fill in, and apply; never commit the filled-in file.
#
#   kubectl apply -f deploy/argo/secret.yaml
#
# Today this points at the Modal deployment (modal_app/serve.py). To move the model to another
# GPU host, change the URL here; nothing else in the workflow changes.
apiVersion: v1
kind: Secret
metadata:
  name: invoice-parser-llm
type: Opaque
stringData:
  INVOICE_PARSER_LLM_URL: "https://<your-modal-url>.modal.run"
  INVOICE_PARSER_LLM_KEY: "<the key the model server was started with>"
  INVOICE_PARSER_MODEL: "Qwen/Qwen3-VL-8B-Instruct"
